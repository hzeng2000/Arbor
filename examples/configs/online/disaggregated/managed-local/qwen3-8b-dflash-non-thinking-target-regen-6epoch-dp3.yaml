model:
  target_model_path: /hzeng/models/Qwen/Qwen3-8B
  draft_model_config: configs/qwen3-8b-dflash.json
  target_backend: sglang
  trust_remote_code: true
  embedding_key: model.embed_tokens.weight
  torch_dtype: bfloat16
  mask_token_id: 151669

data:
  train_data_path: ./cache/dataset/qwen3-8b-non-thinking-nemotron-v2-codealpaca-regen.jsonl
  max_length: 3072
  chat_template: qwen3-instruct
  build_dataset_num_proc: 32
  cache_dir: ./cache/qwen3-8b-nemotron-v2-codealpaca-non-thinking

training:
  strategy: dflash
  num_epochs: 6
  batch_size: 1
  accumulation_steps: 1
  learning_rate: 0.0006
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  attention_backend: flex_attention
  num_anchors: 512
  loss_decay_gamma: 7.0
  save_interval: 100000
  max_checkpoints: 1
  log_interval: 10
  dist_timeout: 30
  seed: 42

tracking:
  report_to: tensorboard

run_id: qwen3-8b-dflash-non-thinking-target-regen-6epoch-20260922
output_dir: ./outputs/qwen3-8b-dflash-non-thinking-target-regen-6epoch-20260922

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 3
  disaggregated:
    control_dir: outputs/qwen3-8b-dflash-non-thinking-target-regen-6epoch-20260922/control
    consumer_state_dir: outputs/qwen3-8b-dflash-non-thinking-target-regen-6epoch-20260922/consumer-state
    backend: mooncake
    managed_local:
      trainer_cuda_visible_devices: ["5", "6", "7"]
      mooncake:
        protocol: tcp
        global_segment_size_bytes: 34359738368
        local_buffer_size_bytes: 1073741824
        default_kv_lease_ttl_ms: 5000
      capture_servers:
        - port: 30000
          cuda_visible_devices: ["4"]
          tp_size: 1
          mem_fraction_static: 0.5
